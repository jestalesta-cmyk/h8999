<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - H89 Dev Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #111114;
            --border: #26262b;
            --text-main: #e6e6e9;
            --text-muted: #8b8b93;
            --primary: #f43f3f;
            --primary-hover: #e03131;
            --error-bg: rgba(244, 63, 63, 0.1);
            --error-text: #f43f3f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Subtle modern glow effect in the background */
            background-image: radial-gradient(circle at top center, rgba(244, 63, 63, 0.08), transparent 40%);
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-area .icon {
            width: 52px;
            height: 52px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--primary);
            margin-bottom: 1.25rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .logo-area h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            background: #0a0a0c;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            padding: 0.875rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(244, 63, 63, 0.15);
        }

        .form-group input::placeholder {
            color: #5a5a62;
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.875rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert {
            display: none;
            padding: 0.875rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .alert.error {
            display: block;
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid rgba(244, 63, 63, 0.2);
        }

        .alert.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #5a5a62;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="logo-area">
        <div class="icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to your H89 Dev account to continue.</p>
    </div>

    <div class="card">
        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">
                Sign In
            </button>
        </form>
    </div>
    
    <div class="footer-text">
        Secure Access Provided by Firebase Auth
    </div>
</div>

<script>
    // ========================================================
    // OYAGE FIREBASE CONFIG EKA (Kalin thibba eka)
    // ========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAGUMoOvEKwwsdNnT2Fqu3KZUgnHX8OK-k",
      authDomain: "h46h-6714c.firebaseapp.com",
      projectId: "h46h-6714c",
      storageBucket: "h46h-6714c.firebasestorage.app",
      messagingSenderId: "45140235959",
      appId: "1:45140235959:web:21daeaa59af1ffdbccdf32",
      measurementId: "G-X6GP20Y6JH"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    // ========================================================

    const alertBox = document.getElementById('alertBox');
    
    function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className = `alert ${type}`;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in...`;
        alertBox.style.display = 'none';
        
        try {
            // Firebase Auth
            const userCredential = await auth.signInWithEmailAndPassword(email, p);
            
            showAlert('Authentication successful. Redirecting...', 'success');
            
            // Backend Session ekata data yawima
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firebase_auth: true })
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                window.location.href = data.redirect;
            } else {
                showAlert('Session creation failed.', 'error');
                btn.disabled = false;
                btn.innerHTML = `Sign In`;
            }
        } catch (err) {
            // Error handling cleanly
            let errorMsg = "Invalid email or password.";
            if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
                errorMsg = "Incorrect email or password. Please try again.";
            } else if (err.code === 'auth/too-many-requests') {
                errorMsg = "Too many failed attempts. Please try again later.";
            } else {
                errorMsg = err.message;
            }
            
            showAlert(errorMsg, 'error');
            btn.disabled = false;
            btn.innerHTML = `Sign In`;
        }
    });
</script>
</body>
</html>
