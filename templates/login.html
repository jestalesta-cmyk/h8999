<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H89 DEV // LOGIN</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Firebase SDK (v8 compat for simplicity) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
  :root {
    --bg: #050505;
    --accent: #ff3344;
    --accent-dim: #991f29;
    --text: #d0d0d0;
    --border: #1a1a1a;
    --border-bright: #333333;
    --green: #00ff41;
  }
  * { box-sizing: border-box; outline: none; }
  body {
    font-family: 'JetBrains Mono', monospace;
    background-color: var(--bg);
    color: var(--text);
    margin: 0; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  
  /* Cyber Grid Background */
  body::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(rgba(255, 51, 68, 0.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255, 51, 68, 0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    z-index: 0; pointer-events: none;
  }

  .login-container {
    position: relative; z-index: 10;
    background: #0a0a0a; border: 1px solid var(--border-bright);
    padding: 40px; width: 100%; max-width: 450px;
    box-shadow: 0 0 30px rgba(255, 51, 68, 0.1);
  }

  .login-container::after {
    content: ''; position: absolute; top: 5px; bottom: 5px; left: 5px; right: 5px;
    border: 1px solid rgba(255, 51, 68, 0.2); pointer-events: none;
  }

  .header {
    text-align: center; margin-bottom: 30px;
  }
  .header h1 {
    font-family: 'Share Tech Mono', monospace;
    color: var(--accent); letter-spacing: 5px; margin: 0 0 10px 0;
    font-size: 28px; text-shadow: 0 0 10px rgba(255, 51, 68, 0.5);
  }
  .header p { color: var(--text); font-size: 11px; margin: 0; opacity: 0.7; }

  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block; font-size: 10px; color: var(--accent); margin-bottom: 8px;
    text-transform: uppercase; font-weight: bold; letter-spacing: 1px;
  }
  .form-group input {
    width: 100%; background: #050505; border: 1px solid var(--border-bright);
    color: #fff; padding: 12px 15px; font-family: 'JetBrains Mono', monospace;
    font-size: 14px; transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(255,51,68,0.2); }

  .btn {
    width: 100%; background: transparent; border: 1px solid var(--accent);
    color: var(--accent); padding: 15px; font-family: 'JetBrains Mono', monospace;
    font-weight: bold; letter-spacing: 2px; font-size: 14px; cursor: pointer;
    transition: all 0.2s; position: relative; overflow: hidden; margin-top: 10px;
  }
  .btn::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: var(--accent); z-index: -1; transition: left 0.2s;
  }
  .btn:hover { color: #000; }
  .btn:hover::before { left: 0; }

  .terminal-box {
    margin-top: 20px; padding: 15px; background: #050505; border: 1px solid var(--border);
    height: 100px; font-size: 10px; color: var(--green); overflow-y: hidden;
    position: relative;
  }
  .terminal-content { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  
  .error-text { color: var(--accent); font-weight: bold; }
  .sys-text { color: var(--text); }
  
  .blinking-cursor::after {
    content: '_'; animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .corner { position: absolute; width: 15px; height: 15px; border-color: var(--accent); border-style: solid; z-index: 20; }
  .tl { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
  .tr { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
  .bl { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
  .br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }
</style>
</head>
<body>

<div class="login-container">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  
  <div class="header">
    <h1>H89 DEV CONSOLE</h1>
    <p>FIREBASE SECURED UPLINK // IDENTIFY</p>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label>FIREBASE_EMAIL</label>
      <input type="email" id="email" autocomplete="off" spellcheck="false" placeholder="jesta@h89.dev" autofocus>
    </div>
    <div class="form-group">
      <label>ACCESS_KEY</label>
      <input type="password" id="password" autocomplete="off" placeholder="••••••••">
    </div>
    <button type="submit" class="btn" id="loginBtn">INITIALIZE_CONNECTION</button>
  </form>

  <div class="terminal-box">
    <div class="terminal-content" id="terminal">
      <div>> FIREBASE_MODULE_LOADED</div>
      <div>> AWAITING_AUTHENTICATION<span class="blinking-cursor"></span></div>
    </div>
  </div>
</div>

<script>
  // ========================================================
  // 🔴 OYAGE FIREBASE CONFIG EKA METHANATA DANNA 🔴
  // ========================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAGUMoOvEKwwsdNnT2Fqu3KZUgnHX8OK-k",
    authDomain: "h46h-6714c.firebaseapp.com",
    projectId: "h46h-6714c",
    storageBucket: "h46h-6714c.firebasestorage.app",
    messagingSenderId: "45140235959",
    appId: "1:45140235959:web:21daeaa59af1ffdbccdf32",
    measurementId: "G-X6GP20Y6JH"
  };
  
  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  // ========================================================

  const term = document.getElementById('terminal');
  
  function addLog(msg, type='sys') {
    const colorClass = type === 'error' ? 'error-text' : (type === 'success' ? 'sys-text' : '');
    const style = type === 'success' ? 'color: var(--green)' : '';
    const line = document.createElement('div');
    line.className = colorClass;
    if(style) line.style = style;
    line.innerHTML = `> ${msg}`;
    
    const cursors = term.querySelectorAll('.blinking-cursor');
    cursors.forEach(c => c.remove());
    
    line.innerHTML += '<span class="blinking-cursor"></span>';
    term.appendChild(line);
    
    if (term.children.length > 5) { term.removeChild(term.children[0]); }
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const p = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    
    if(!email || !p) { addLog('FIELDS_CANNOT_BE_EMPTY', 'error'); return; }

    addLog('CONTACTING_FIREBASE_SERVERS...', 'sys');
    btn.disabled = true;
    btn.innerText = "AUTHENTICATING...";
    
    try {
      // 1. Firebase eken login wenawa
      const userCredential = await auth.signInWithEmailAndPassword(email, p);
      const user = userCredential.user;
      
      addLog(`AUTH_SUCCESS: ${user.email}`, 'success');
      addLog('ESTABLISHING_SECURE_UPLINK...', 'sys');
      
      // 2. Flask backend ekata signal eka denawa session eka hadanna
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ firebase_auth: true })
      });
      const data = await res.json();
      
      if (data.status === 'success') {
        setTimeout(() => { window.location.href = data.redirect; }, 1000);
      }
    } catch (err) {
      addLog(`FIREBASE_ERROR: ${err.message}`, 'error');
      btn.disabled = false;
      btn.innerText = "INITIALIZE_CONNECTION";
    }
  });
</script>
</body>
</html>
