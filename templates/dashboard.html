<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - H89 Dev Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/tailwind.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        body { background-color: #050505; color: #e6e6e9; font-family: 'Inter', sans-serif; }
        .stat-card { background: #0a0a0c; border: 1px solid #1a1a1a; border-radius: 12px; padding: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 30px; border: 2px solid #f43f3f; color: #f43f3f; }
    </style>
</head>
<body class="pb-12">
    <!-- Header -->
    <header class="border-b border-[#1a1a1a] bg-[#050505]/90 backdrop-blur sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-[#0a0a0c] border border-[#1a1a1a] flex items-center justify-center overflow-hidden">
                        <img src="/static/logo.png" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <div class="leading-tight"><h1 class="text-base font-extrabold text-white">H89 Dev Tools</h1></div>
                </a>
            </div>
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-[#8b8b93]">
                <a href="/" class="hover:text-white transition">Home</a>
                <a href="/dashboard" class="text-white transition">Dashboard</a>
                <a href="/console" class="hover:text-white transition">Console</a>
                <a href="/trolling" class="hover:text-white transition">Server Trolling</a>
            </nav>
            <button onclick="logout()" class="px-4 py-2 bg-[#1a1a1a] hover:bg-red-500 hover:text-white text-xs font-bold rounded transition">LOGOUT</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10">
        <div class="flex items-center gap-6 mb-10 bg-[#0a0a0c] p-6 rounded-xl border border-[#1a1a1a]">
            <div class="avatar"><i class="fa-solid fa-user-astronaut"></i></div>
            <div>
                <h1 class="text-2xl font-extrabold text-white" id="userEmail">Loading...</h1>
                <p class="text-[#8b8b93] text-sm mt-1" id="userId">UID: ...</p>
                <div class="mt-2 inline-block px-3 py-1 bg-green-500/10 text-green-500 text-[10px] font-bold rounded uppercase tracking-wider">H89 Admin Access Verified</div>
            </div>
        </div>

        <h2 class="text-lg font-bold text-white mb-4">Your Statistics</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="stat-card">
                <div class="text-[#8b8b93] text-xs font-bold uppercase mb-2">Total Scans</div>
                <div class="text-3xl font-extrabold text-white">1,492</div>
            </div>
            <div class="stat-card">
                <div class="text-[#8b8b93] text-xs font-bold uppercase mb-2">Webhooks Extracted</div>
                <div class="text-3xl font-extrabold text-blue-500">8,304</div>
            </div>
            <div class="stat-card">
                <div class="text-[#8b8b93] text-xs font-bold uppercase mb-2">Servers Resolved</div>
                <div class="text-3xl font-extrabold text-red-500">421</div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAGUMoOvEKwwsdNnT2Fqu3KZUgnHX8OK-k",
          authDomain: "h46h-6714c.firebaseapp.com",
          projectId: "h46h-6714c",
          storageBucket: "h46h-6714c.firebasestorage.app",
          messagingSenderId: "45140235959",
          appId: "1:45140235959:web:21daeaa59af1ffdbccdf32",
        };
        firebase.initializeApp(firebaseConfig);
        
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('userId').innerText = `UID: ${user.uid}`;
            } else {
                document.getElementById('userEmail').innerText = "Session Expired";
            }
        });

        function logout() {
            firebase.auth().signOut().then(() => {
                window.location.href = '/login';
            });
        }
    </script>
</body>
</html>
